<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOLAR SYSTEM ODYSSEY · 太陽系探索之旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ========== VARIABLES ========== */
:root {
  --bg0: #020510; --bg1: #060d1f; --bg2: #0a1530;
  --gold: #FFD700; --sun: #FFA500; --cyan: #00E5FF; --violet: #A78BFA;
  --mars: #E57373; --jupiter: #FFB74D; --saturn: #F0E68C; --neptune: #64B5F6;
  --text: #E0E8F0; --mute: #7A8DA0; --dim: #3D5060;
  --line: rgba(0,229,255,.15); --line2: rgba(0,229,255,.35);
  --glass: rgba(6,13,31,.82);
  --display: "Orbitron", "Noto Sans TC", system-ui, sans-serif;
  --body: "Noto Sans TC", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg0);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ========== STARFIELD CANVAS ========== */
#stars { position: fixed; inset: 0; z-index: 0; }

/* ========== APP CONTAINER ========== */
#app {
  position: fixed; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
}

/* ========== HEADER ========== */
#header {
  position: relative; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px;
  background: rgba(6,13,31,.6);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand svg { width: 36px; height: 36px; }
.brand h1 {
  font-family: var(--display); font-size: 16px; font-weight: 700;
  letter-spacing: .18em; margin: 0; line-height: 1.2;
}
.brand small {
  display: block; font-family: var(--mono); font-size: 10px;
  letter-spacing: .2em; color: var(--mute); margin-top: 2px;
}
.nav-pills { display: flex; gap: 6px; }
.nav-pills button {
  font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--line); color: var(--mute);
  backdrop-filter: blur(6px); transition: all .3s;
}
.nav-pills button:hover, .nav-pills button.active {
  border-color: var(--cyan); color: var(--cyan);
  background: rgba(0,229,255,.08);
  box-shadow: 0 0 12px rgba(0,229,255,.2);
}

/* ========== MAIN AREA ========== */
#main {
  flex: 1; display: flex; position: relative; overflow: hidden;
}

/* ========== ORBIT VIEW ========== */
#orbitView {
  flex: 1; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
#orbitCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ========== PLANET DETAIL PANEL ========== */
#detailPanel {
  position: absolute; z-index: 8;
  top: 12px; right: 12px; bottom: 12px;
  width: min(520px, 45vw);
  background: var(--glass);
  backdrop-filter: blur(22px) saturate(1.2);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  display: flex; flex-direction: column;
  transform: translateX(calc(100% + 30px));
  transition: transform .55s cubic-bezier(.2,.8,.2,1);
  overflow: hidden;
}
#detailPanel.open { transform: none; }
#detailPanel header {
  padding: 24px 26px 0; position: relative;
}
#detailPanel .planet-idx {
  font-family: var(--mono); font-size: 12px;
  letter-spacing: .2em; color: var(--cyan);
}
#detailPanel h2 {
  margin: 6px 0 0; font-family: var(--display);
  font-weight: 700; font-size: 28px;
  letter-spacing: .08em; line-height: 1.1;
}
#detailPanel .zh-name {
  font-size: 16px; color: var(--mute);
  letter-spacing: .12em; margin-top: 4px;
}
#detailPanel .lead {
  margin: 10px 0 0; color: var(--text);
  opacity: .9; max-width: 60ch; font-size: 14px;
}
.close-btn {
  position: absolute; top: 18px; right: 18px;
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line); color: var(--mute);
  font-size: 18px; line-height: 1;
  transition: all .2s;
}
.close-btn:hover { color: #fff; border-color: var(--line2); }

/* tabs */
.tabs {
  display: flex; gap: 4px; margin: 18px 0 0;
  padding: 0; list-style: none;
  border-bottom: 1px solid var(--line);
}
.tabs button {
  flex: 1; border: 0; border-bottom: 2px solid transparent;
  padding: 10px 4px; font-family: var(--mono);
  font-size: 10.5px; letter-spacing: .14em; color: var(--mute);
  transition: all .3s;
}
.tabs button.on { color: #EEF6FF; border-bottom-color: var(--cyan); }

/* panel body */
.panel-body {
  flex: 1; overflow: auto; padding: 20px 26px 26px;
  overscroll-behavior: contain;
}
.panel-foot {
  border-top: 1px solid var(--line);
  padding: 12px 26px;
  display: flex; justify-content: space-between;
  align-items: center; gap: 10px;
}

/* cards */
.info-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.info-card {
  border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; background: rgba(0,229,255,.025);
  transition: border-color .3s;
}
.info-card:hover { border-color: var(--line2); }
.info-card .label {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: .16em; color: var(--mute);
  margin-bottom: 4px;
}
.info-card .value {
  font-family: var(--display); font-weight: 600;
  font-size: 18px; letter-spacing: .04em;
}
.info-card .unit {
  font-family: var(--mono); font-size: 11px; color: var(--mute);
  margin-left: 4px;
}

/* fun facts list */
.facts-list { list-style: none; padding: 0; margin: 0 0 18px; }
.facts-list li {
  padding: 10px 14px; border-left: 2px solid var(--cyan);
  margin-bottom: 8px; font-size: 14px;
  background: rgba(0,229,255,.03); border-radius: 0 10px 10px 0;
}

/* comparison bars */
.compare-bar { margin-bottom: 12px; }
.compare-bar .bar-label {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--mute); margin-bottom: 4px;
}
.compare-bar .bar-track {
  height: 6px; background: rgba(0,229,255,.1);
  border-radius: 3px; overflow: hidden;
}
.compare-bar .bar-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--violet));
  transition: width 1s cubic-bezier(.2,.8,.2,1);
}

/* quiz */
.quiz-option {
  display: block; width: 100%; text-align: left;
  border: 1px solid var(--line); background: rgba(0,229,255,.03);
  border-radius: 10px; padding: 12px 16px;
  margin: 6px 0; font-size: 14px; transition: all .3s;
}
.quiz-option:hover { border-color: var(--line2); background: rgba(0,229,255,.06); }
.quiz-option.correct { border-color: #4CAF50; background: rgba(76,175,80,.1); }
.quiz-option.wrong { border-color: var(--mars); background: rgba(229,115,115,.08); }
.quiz-result {
  margin-top: 12px; padding: 12px; border-radius: 10px;
  font-size: 13px; border: 1px solid;
}
.quiz-result.correct { border-color: #4CAF50; background: rgba(76,175,80,.08); color: #81C784; }
.quiz-result.wrong { border-color: var(--mars); background: rgba(229,115,115,.06); color: var(--mars); }

/* btn */
.btn {
  background: rgba(0,229,255,.12); border: 1px solid rgba(0,229,255,.5);
  color: #EAF8FF; border-radius: 10px; padding: 10px 18px;
  font-family: var(--display); font-weight: 600;
  letter-spacing: .1em; font-size: 13px; transition: all .3s;
}
.btn:hover { background: rgba(0,229,255,.22); }
.btn.sm { padding: 6px 12px; font-size: 12px; }
.ghost-btn {
  background: none; border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px;
  color: var(--mute); font-size: 12px; transition: all .3s;
}
.ghost-btn:hover { color: var(--text); border-color: var(--line2); }
.note { font-size: 12px; color: var(--mute); }

/* ========== BOTTOM BAR ========== */
#bottomBar {
  position: relative; z-index: 10;
  display: flex; justify-content: center; align-items: center;
  gap: 12px; padding: 14px 24px;
  background: rgba(6,13,31,.6);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.speed-control {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: .12em; color: var(--mute);
}
.speed-control input[type=range] {
  width: 100px; accent-color: var(--cyan);
}
.planet-dots { display: flex; gap: 8px; align-items: center; }
.planet-dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.3);
  transition: all .3s; cursor: pointer;
  position: relative;
}
.planet-dot:hover { transform: scale(1.4); }
.planet-dot.active {
  transform: scale(1.6);
  box-shadow: 0 0 10px currentColor;
}
.planet-dot .tooltip {
  position: absolute; bottom: calc(100% + 8px);
  left: 50%; transform: translateX(-50%);
  font-family: var(--mono); font-size: 10px;
  letter-spacing: .1em; white-space: nowrap;
  background: var(--glass); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 8px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.planet-dot:hover .tooltip { opacity: 1; }

/* ========== INTRO OVERLAY ========== */
#intro {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  pointer-events: auto;
}
#intro .veil {
  position: absolute; inset: 0;
  background: var(--bg0);
  transition: opacity 1.5s;
}
#intro .title { position: relative; text-align: center; }
#intro h1 {
  margin: 0; font-family: var(--display);
  font-weight: 700; letter-spacing: .24em;
  font-size: clamp(24px, 5vw, 64px);
  color: #F2FAFF; opacity: 0;
  text-indent: .24em;
  animation: fadeIn 1.5s .5s forwards;
}
#intro .zh {
  font-size: clamp(14px, 2vw, 22px);
  letter-spacing: .3em; color: var(--gold);
  opacity: 0; margin-top: 10px;
  animation: fadeIn 1.5s 1.2s forwards;
}
#intro .sub {
  font-family: var(--mono); font-size: 12px;
  letter-spacing: .4em; color: var(--mute);
  margin-top: 18px; opacity: 0;
  animation: fadeIn 1.5s 1.8s forwards;
}
#intro .enter-btn {
  margin-top: 40px; opacity: 0;
  animation: fadeIn 1.5s 2.5s forwards;
}
#intro .enter-btn button {
  font-family: var(--display); font-size: 14px;
  letter-spacing: .2em; padding: 14px 36px;
  border: 1px solid var(--gold);
  color: var(--gold); border-radius: 30px;
  background: rgba(255,215,0,.08);
  transition: all .4s;
}
#intro .enter-btn button:hover {
  background: rgba(255,215,0,.2);
  box-shadow: 0 0 30px rgba(255,215,0,.3);
}
@keyframes fadeIn { to { opacity: 1; } }

#intro.hide .veil { opacity: 0; }
#intro.hide { pointer-events: none; }

/* ========== PLANET LABEL OVERLAY ========== */
.planet-label-overlay {
  position: absolute; z-index: 5;
  pointer-events: none;
}
.planet-label {
  position: absolute;
  font-family: var(--display); font-size: 10px;
  letter-spacing: .14em; color: rgba(255,255,255,.6);
  white-space: nowrap;
  transform: translate(-50%, 20px);
  pointer-events: auto; cursor: pointer;
  transition: color .3s, text-shadow .3s;
}
.planet-label:hover {
  color: var(--cyan);
  text-shadow: 0 0 10px rgba(0,229,255,.5);
}

/* ========== SIZE COMPARISON VIEW ========== */
#sizeView {
  display: none; flex: 1;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
#sizeCanvas { width: 100%; height: 100%; }

/* ========== DISTANCE VIEW ========== */
#distView {
  display: none; flex: 1;
  flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px; overflow: auto;
}
.distance-chart {
  width: 100%; max-width: 900px;
}
.dist-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px;
}
.dist-icon {
  width: 36px; height: 36px; border-radius: 50%;
  flex-shrink: 0; display: grid; place-items: center;
  font-size: 18px;
}
.dist-name {
  width: 80px; flex-shrink: 0;
  font-family: var(--display); font-size: 12px;
  letter-spacing: .1em;
}
.dist-bar-track {
  flex: 1; height: 8px; background: rgba(255,255,255,.06);
  border-radius: 4px; overflow: hidden; position: relative;
}
.dist-bar-fill {
  height: 100%; border-radius: 4px;
  transition: width 1.5s cubic-bezier(.2,.8,.2,1);
}
.dist-val {
  width: 90px; text-align: right;
  font-family: var(--mono); font-size: 12px; color: var(--mute);
}

/* ========== RESPONSIVE ========== */
@media (max-width: 760px) {
  #header { padding: 12px 16px; }
  .brand h1 { font-size: 13px; }
  .nav-pills { display: none; }
  #detailPanel {
    inset: 0; width: auto; border-radius: 0;
    top: 0; right: 0; bottom: 0;
  }
  .info-cards { grid-template-columns: 1fr; }
  #bottomBar { flex-wrap: wrap; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}

/* section title */
.sec-title {
  font-family: var(--mono); font-weight: 500;
  font-size: 11px; letter-spacing: .24em;
  color: var(--mute); margin: 0 0 12px;
  text-transform: uppercase;
}

/* 3D planet preview */
.planet-preview {
  width: 120px; height: 120px;
  margin: 0 auto 16px;
  border-radius: 50%;
  position: relative;
  animation: planetFloat 4s ease-in-out infinite;
}
.planet-preview::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%,
    rgba(255,255,255,.3) 0%, transparent 50%);
}
@keyframes planetFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* ring for saturn */
.planet-preview.has-ring::before {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 180px; height: 40px;
  margin-left: -90px; margin-top: -20px;
  border: 3px solid rgba(240,230,140,.4);
  border-radius: 50%;
  transform: rotateX(75deg);
}

/* composition bar */
.comp-bar {
  display: flex; height: 10px;
  border-radius: 5px; overflow: hidden;
  margin: 8px 0 14px;
}
.comp-segment { height: 100%; transition: width .8s; }
.comp-legend {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 14px;
}
.comp-legend span {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--mute);
}
.comp-legend i {
  width: 10px; height: 10px; border-radius: 2px;
  display: inline-block; font-style: normal;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<!-- ===== INTRO ===== -->
<div id="intro">
  <div class="veil"></div>
  <div class="title">
    <h1>SOLAR SYSTEM ODYSSEY</h1>
    <div class="zh">太陽系探索之旅</div>
    <div class="sub">EXPLORE THE WONDERS OF OUR COSMIC NEIGHBORHOOD</div>
    <div class="enter-btn">
      <button id="enterBtn">LAUNCH EXPLORER →</button>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <div id="header">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="8" fill="#FFA500"/>
        <circle cx="20" cy="20" r="16" fill="none" stroke="#FFD700" stroke-opacity=".3" stroke-dasharray="2 3">
          <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="10s" repeatCount="indefinite"/>
        </circle>
        <circle cx="36" cy="20" r="2.5" fill="#64B5F6">
          <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="10s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="20" r="12" fill="none" stroke="#A78BFA" stroke-opacity=".2" stroke-dasharray="1 4">
          <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="-360 20 20" dur="15s" repeatCount="indefinite"/>
        </circle>
      </svg>
      <div>
        <h1>SOLAR SYSTEM ODYSSEY</h1>
        <small>太陽系探索之旅</small>
      </div>
    </div>
    <div class="nav-pills">
      <button class="active" data-view="orbit">ORBIT VIEW</button>
      <button data-view="size">SIZE COMPARE</button>
      <button data-view="distance">DISTANCE MAP</button>
    </div>
  </div>

  <div id="main">
    <div id="orbitView">
      <canvas id="orbitCanvas"></canvas>
      <div class="planet-label-overlay" id="labelOverlay"></div>
    </div>
    <div id="sizeView">
      <canvas id="sizeCanvas"></canvas>
    </div>
    <div id="distView">
      <h2 style="font-family:var(--display);letter-spacing:.16em;margin-bottom:30px;text-align:center">
        DISTANCE FROM THE SUN
      </h2>
      <div class="distance-chart" id="distChart"></div>
    </div>

    <!-- Detail Panel -->
    <section id="detailPanel" aria-label="Planet details" aria-hidden="true">
      <header>
        <div class="planet-idx" id="pIdx"></div>
        <h2 id="pTitle"></h2>
        <div class="zh-name" id="pZh"></div>
        <p class="lead" id="pLead"></p>
        <button class="close-btn" id="pClose">×</button>
        <div class="tabs" id="pTabs">
          <button class="on" data-tab="overview">OVERVIEW</button>
          <button data-tab="facts">FUN FACTS</button>
          <button data-tab="composition">COMPOSITION</button>
          <button data-tab="quiz">QUIZ</button>
        </div>
      </header>
      <div class="panel-body" id="pBody"></div>
      <div class="panel-foot">
        <button class="ghost-btn" id="pPrev">← PREVIOUS</button>
        <span class="note" id="pNote"></span>
        <button class="btn" id="pNext">NEXT →</button>
      </div>
    </section>
  </div>

  <div id="bottomBar">
    <div class="speed-control">
      <span>SPEED</span>
      <input type="range" id="speedSlider" min="0" max="200" value="50">
      <span id="speedVal">1.0×</span>
    </div>
    <div style="width:1px;height:24px;background:var(--line);margin:0 8px"></div>
    <div class="planet-dots" id="planetDots"></div>
    <div style="width:1px;height:24px;background:var(--line);margin:0 8px"></div>
    <button class="btn sm" id="toggleOrbits">SHOW ORBITS</button>
    <button class="btn sm" id="toggleLabels">LABELS ON</button>
  </div>
</div>

<script>
"use strict";

/* ========== PLANET DATA ========== */
const PLANETS = [
  {
    id: "sun", n: 0, en: "SUN", zh: "太陽",
    color: "#FFA500", radius: 30, orbitR: 0, speed: 0, emoji: "☀️",
    lead: "The Sun is a G-type main-sequence star at the center of our solar system. It contains 99.86% of the solar system's total mass.",
    stats: [
      { label: "DIAMETER", value: "1,392,700", unit: "km" },
      { label: "MASS", value: "1.989×10³⁰", unit: "kg" },
      { label: "SURFACE TEMP", value: "5,500", unit: "°C" },
      { label: "AGE", value: "4.6", unit: "billion yr" },
    ],
    facts: [
      "The Sun accounts for about 99.86% of the total mass of the Solar System.",
      "Light from the Sun takes about 8 minutes and 20 seconds to reach Earth.",
      "The Sun's core temperature reaches about 15 million °C.",
      "About 1 million Earths could fit inside the Sun.",
      "The Sun is roughly halfway through its life, with about 5 billion years left.",
    ],
    composition: [
      { name: "Hydrogen", pct: 73.46, color: "#00E5FF" },
      { name: "Helium", pct: 24.85, color: "#FFD700" },
      { name: "Others", pct: 1.69, color: "#A78BFA" },
    ],
    quiz: {
      q: "What type of star is our Sun?",
      opts: ["G-type main-sequence star (yellow dwarf)", "Red dwarf", "Blue supergiant", "White dwarf"],
      a: 0, why: "The Sun is classified as a G2V star — a yellow dwarf on the main sequence, fusing hydrogen into helium in its core."
    },
    sizeRatio: 1, distAU: 0,
  },
  {
    id: "mercury", n: 1, en: "MERCURY", zh: "水星",
    color: "#B0BEC5", radius: 4, orbitR: 65, speed: 4.15, emoji: "🪨",
    lead: "Mercury is the smallest planet and closest to the Sun. Despite its proximity, it's not the hottest — Venus holds that title.",
    stats: [
      { label: "DIAMETER", value: "4,879", unit: "km" },
      { label: "DISTANCE", value: "0.39", unit: "AU" },
      { label: "ORBITAL PERIOD", value: "88", unit: "days" },
      { label: "SURFACE TEMP", value: "-180 ~ 430", unit: "°C" },

/* ========== STARFIELD ========== */
const starsCanvas = document.getElementById("stars");
const starsCtx = starsCanvas.getContext("2d");
let starsList = [];

function initStars() {
  starsCanvas.width = window.innerWidth;
  starsCanvas.height = window.innerHeight;
  starsList = [];
  const count = Math.floor((starsCanvas.width * starsCanvas.height) / 800);
  for (let i = 0; i < count; i++) {
    starsList.push({
      x: Math.random() * starsCanvas.width,
      y: Math.random() * starsCanvas.height,
      r: Math.random() * 1.5 + 0.3,
      a: Math.random() * 0.7 + 0.3,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005,
    });
  }
}

function drawStars(t) {
  starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
  for (const s of starsList) {
    s.twinkle += s.speed;
    const alpha = s.a * (0.5 + 0.5 * Math.sin(s.twinkle));
    starsCtx.beginPath();
    starsCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    starsCtx.fillStyle = `rgba(255,255,255,${alpha})`;
    starsCtx.fill();
  }
}

initStars();
window.addEventListener("resize", () => {
  initStars();
  resizeOrbitCanvas();
  resizeSizeCanvas();
});

/* ========== ORBIT VIEW ========== */
const orbitCanvas = document.getElementById("orbitCanvas");
const octx = orbitCanvas.getContext("2d");
let showOrbits = true;
let showLabels = true;
let simSpeed = 1.0;
let planetAngles = PLANETS.map(() => Math.random() * Math.PI * 2);
let hoveredPlanet = -1;
let selectedPlanet = -1;
let animTime = 0;

function resizeOrbitCanvas() {
  const rect = orbitCanvas.parentElement.getBoundingClientRect();
  orbitCanvas.width = rect.width * devicePixelRatio;
  orbitCanvas.height = rect.height * devicePixelRatio;
  orbitCanvas.style.width = rect.width + "px";
  orbitCanvas.style.height = rect.height + "px";
}

function drawOrbitView(dt) {
  const w = orbitCanvas.width, h = orbitCanvas.height;
  const cx = w / 2, cy = h / 2;
  const dpr = devicePixelRatio;
  octx.clearRect(0, 0, w, h);

  // scale to fit
  const maxOrbit = PLANETS[PLANETS.length - 1].orbitR;
  const scale = Math.min(w, h) / (maxOrbit * 2 + 80) * dpr;

  // draw orbits
  if (showOrbits) {
    for (let i = 1; i < PLANETS.length; i++) {
      const p = PLANETS[i];
      octx.beginPath();
      octx.arc(cx, cy, p.orbitR * scale, 0, Math.PI * 2);
      octx.strokeStyle = i === hoveredPlanet || i === selectedPlanet
        ? "rgba(0,229,255,.25)" : "rgba(255,255,255,.06)";
      octx.lineWidth = 1 * dpr;
      octx.stroke();
    }
  }

  // update angles & draw planets
  const planetPositions = [];
  for (let i = 0; i < PLANETS.length; i++) {
    const p = PLANETS[i];
    if (p.speed > 0) {
      planetAngles[i] += p.speed * 0.002 * simSpeed * dt;
    }
    const angle = planetAngles[i];
    const px = cx + Math.cos(angle) * p.orbitR * scale;
    const py = cy + Math.sin(angle) * p.orbitR * scale;
    planetPositions.push({ x: px, y: py });

    // glow
    const isActive = i === hoveredPlanet || i === selectedPlanet;
    if (isActive || i === 0) {
      const gradient = octx.createRadialGradient(px, py, 0, px, py, p.radius * scale * 2.5);
      gradient.addColorStop(0, p.color + "40");
      gradient.addColorStop(1, p.color + "00");
      octx.beginPath();
      octx.arc(px, py, p.radius * scale * 2.5, 0, Math.PI * 2);
      octx.fillStyle = gradient;
      octx.fill();
    }

    // planet body
    const r = p.radius * scale * (isActive ? 1.2 : 1);
    const gradient2 = octx.createRadialGradient(
      px - r * 0.3, py - r * 0.3, r * 0.1,
      px, py, r
    );
    gradient2.addColorStop(0, lightenColor(p.color, 40));
    gradient2.addColorStop(0.7, p.color);
    gradient2.addColorStop(1, darkenColor(p.color, 40));
    octx.beginPath();
    octx.arc(px, py, r, 0, Math.PI * 2);
    octx.fillStyle = gradient2;
    octx.fill();

    // ring for saturn
    if (p.hasRing) {
      octx.save();
      octx.translate(px, py);
      octx.scale(1, 0.3);
      octx.beginPath();
      octx.arc(0, 0, r * 1.8, 0, Math.PI * 2);
      octx.strokeStyle = p.color + "60";
      octx.lineWidth = 3 * dpr;
      octx.stroke();
      octx.beginPath();
      octx.arc(0, 0, r * 2.1, 0, Math.PI * 2);
      octx.strokeStyle = p.color + "30";
      octx.lineWidth = 2 * dpr;
      octx.stroke();
      octx.restore();
    }
  }

  // update labels
  updateLabels(planetPositions, scale);
}

function lightenColor(hex, pct) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) + pct; if (r > 255) r = 255;
  let g = ((num >> 8) & 0xff) + pct; if (g > 255) g = 255;
  let b = (num & 0xff) + pct; if (b > 255) b = 255;
  return `rgb(${r},${g},${b})`;
}
function darkenColor(hex, pct) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) - pct; if (r < 0) r = 0;
  let g = ((num >> 8) & 0xff) - pct; if (g < 0) g = 0;
  let b = (num & 0xff) - pct; if (b < 0) b = 0;
  return `rgb(${r},${g},${b})`;
}

/* ========== LABELS ========== */
const labelOverlay = document.getElementById("labelOverlay");
let labelEls = [];

function createLabels() {
  labelOverlay.innerHTML = "";
  labelEls = [];
  for (let i = 0; i < PLANETS.length; i++) {
    const el = document.createElement("div");
    el.className = "planet-label";
    el.textContent = PLANETS[i].en;
    el.dataset.idx = i;
    el.addEventListener("click", () => openDetail(i));
    el.addEventListener("mouseenter", () => { hoveredPlanet = i; });
    el.addEventListener("mouseleave", () => { hoveredPlanet = -1; });
    labelOverlay.appendChild(el);
    labelEls.push(el);
  }
}

function updateLabels(positions, scale) {
  const dpr = devicePixelRatio;
  for (let i = 0; i < positions.length; i++) {
    const lbl = labelEls[i];
    if (!lbl) continue;
    lbl.style.display = showLabels ? "" : "none";
    lbl.style.left = (positions[i].x / dpr) + "px";
    lbl.style.top = (positions[i].y / dpr + PLANETS[i].radius * scale / dpr) + "px";
  }
}

/* ========== ORBIT CANVAS INTERACTION ========== */
orbitCanvas.addEventListener("click", (e) => {
  const rect = orbitCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * devicePixelRatio;
  const my = (e.clientY - rect.top) * devicePixelRatio;
  const cx = orbitCanvas.width / 2, cy = orbitCanvas.height / 2;
  const maxOrbit = PLANETS[PLANETS.length - 1].orbitR;
  const scale = Math.min(orbitCanvas.width, orbitCanvas.height) / (maxOrbit * 2 + 80) * devicePixelRatio;

  for (let i = PLANETS.length - 1; i >= 0; i--) {
    const p = PLANETS[i];
    const angle = planetAngles[i];
    const px = cx + Math.cos(angle) * p.orbitR * scale;
    const py = cy + Math.sin(angle) * p.orbitR * scale;
    const dist = Math.hypot(mx - px, my - py);
    const hitR = Math.max(p.radius * scale * 1.5, 15 * devicePixelRatio);
    if (dist < hitR) {
      openDetail(i);
      return;
    }
  }
});

orbitCanvas.addEventListener("mousemove", (e) => {
  const rect = orbitCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * devicePixelRatio;
  const my = (e.clientY - rect.top) * devicePixelRatio;
  const cx = orbitCanvas.width / 2, cy = orbitCanvas.height / 2;
  const maxOrbit = PLANETS[PLANETS.length - 1].orbitR;
  const scale = Math.min(orbitCanvas.width, orbitCanvas.height) / (maxOrbit * 2 + 80) * devicePixelRatio;

  hoveredPlanet = -1;
  for (let i = PLANETS.length - 1; i >= 0; i--) {
    const p = PLANETS[i];
    const angle = planetAngles[i];
    const px = cx + Math.cos(angle) * p.orbitR * scale;
    const py = cy + Math.sin(angle) * p.orbitR * scale;
    const dist = Math.hypot(mx - px, my - py);
    const hitR = Math.max(p.radius * scale * 1.5, 15 * devicePixelRatio);
    if (dist < hitR) {
      hoveredPlanet = i;
      orbitCanvas.style.cursor = "pointer";
      return;
    }
  }
  orbitCanvas.style.cursor = "default";
});

/* ========== SIZE COMPARISON VIEW ========== */
const sizeCanvas = document.getElementById("sizeCanvas");
const sctx = sizeCanvas.getContext("2d");

function resizeSizeCanvas() {
  const parent = sizeCanvas.parentElement;
  sizeCanvas.width = parent.clientWidth * devicePixelRatio;
  sizeCanvas.height = parent.clientHeight * devicePixelRatio;
  sizeCanvas.style.width = parent.clientWidth + "px";
  sizeCanvas.style.height = parent.clientHeight + "px";
}

function drawSizeView(t) {
  const w = sizeCanvas.width, h = sizeCanvas.height;
  const dpr = devicePixelRatio;
  sctx.clearRect(0, 0, w, h);

  // skip sun for reasonable scale, show it as truncated
  const planets = PLANETS.slice(1);
  const maxR = 10.97; // Jupiter
  const maxDrawR = h * 0.35;
  const scale = maxDrawR / maxR;

  const totalWidth = planets.length * (maxDrawR * 0.5);
  const startX = (w - totalWidth) / 2 + maxDrawR * 0.25;

  // title
  sctx.font = `${14 * dpr}px Orbitron`;
  sctx.fillStyle = "rgba(255,255,255,.4)";
  sctx.textAlign = "center";
  sctx.fillText("PLANET SIZE COMPARISON (RELATIVE TO EARTH)", w / 2, 40 * dpr);

  for (let i = 0; i < planets.length; i++) {
    const p = planets[i];
    const cx = startX + i * (maxDrawR * 0.5);
    const cy = h * 0.6;
    const r = Math.max(p.sizeRatio * scale, 3 * dpr);

    // shadow
    const grad = sctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, p.color + "60");
    grad.addColorStop(1, p.color + "00");
    sctx.beginPath();
    sctx.arc(cx, cy, r * 1.5, 0, Math.PI * 2);
    sctx.fillStyle = grad;
    sctx.fill();

    // planet
    const grad2 = sctx.createRadialGradient(cx - r * 0.25, cy - r * 0.25, r * 0.1, cx, cy, r);
    grad2.addColorStop(0, lightenColor(p.color, 50));
    grad2.addColorStop(0.7, p.color);
    grad2.addColorStop(1, darkenColor(p.color, 50));
    sctx.beginPath();
    sctx.arc(cx, cy, r, 0, Math.PI * 2);
    sctx.fillStyle = grad2;
    sctx.fill();

    // ring
    if (p.hasRing) {
      sctx.save();
      sctx.translate(cx, cy);
      sctx.scale(1, 0.3);
      sctx.beginPath();
      sctx.arc(0, 0, r * 1.7, 0, Math.PI * 2);
      sctx.strokeStyle = p.color + "50";
      sctx.lineWidth = 2 * dpr;
      sctx.stroke();
      sctx.restore();
    }

    // label
    sctx.font = `${10 * dpr}px Orbitron`;
    sctx.fillStyle = "rgba(255,255,255,.6)";
    sctx.textAlign = "center";
    sctx.fillText(p.en, cx, cy + r + 20 * dpr);

    // ratio
    sctx.font = `${9 * dpr}px "JetBrains Mono"`;
    sctx.fillStyle = "rgba(255,255,255,.3)";
    sctx.fillText(`${p.sizeRatio}× Earth`, cx, cy + r + 34 * dpr);
  }
}

/* ========== DISTANCE VIEW ========== */
function buildDistanceView() {
  const chart = document.getElementById("distChart");
  chart.innerHTML = "";
  const maxDist = 30.07; // Neptune
  for (let i = 1; i < PLANETS.length; i++) {
    const p = PLANETS[i];
    const pct = (p.distAU / maxDist) * 100;
    const row = document.createElement("div");
    row.className = "dist-row";
    row.innerHTML = `
      <div class="dist-icon" style="background:${p.color}30;border:1px solid ${p.color}60">
        <span>${p.emoji}</span>
      </div>
      <div class="dist-name" style="color:${p.color}">${p.en}</div>
      <div class="dist-bar-track">
        <div class="dist-bar-fill" style="width:0%;background:linear-gradient(90deg,${p.color}80,${p.color})"></div>
      </div>
      <div class="dist-val">${p.distAU} AU</div>
    `;
    chart.appendChild(row);
    // animate
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        row.querySelector(".dist-bar-fill").style.width = pct + "%";
      });
    });
  }
}

/* ========== DETAIL PANEL ========== */
const detailPanel = document.getElementById("detailPanel");
let currentTab = "overview";

function openDetail(idx) {
  selectedPlanet = idx;
  const p = PLANETS[idx];
  document.getElementById("pIdx").textContent = `${String(idx).padStart(2, "0")} / ${PLANETS.length - 1}`;
  document.getElementById("pTitle").textContent = p.en;
  document.getElementById("pTitle").style.color = p.color;
  document.getElementById("pZh").textContent = p.zh;
  document.getElementById("pLead").textContent = p.lead;
  document.getElementById("pNote").textContent = p.en;
  currentTab = "overview";
  updateTabs();
  renderTabContent(p);
  detailPanel.classList.add("open");
  detailPanel.setAttribute("aria-hidden", "false");

  // highlight planet dot
  document.querySelectorAll(".planet-dot").forEach((d, i) => {
    d.classList.toggle("active", i === idx);
  });
}

function closeDetail() {
  detailPanel.classList.remove("open");
  detailPanel.setAttribute("aria-hidden", "true");
  selectedPlanet = -1;
  document.querySelectorAll(".planet-dot").forEach(d => d.classList.remove("active"));
}

function updateTabs() {
  document.querySelectorAll("#pTabs button").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === currentTab);
  });
}

function renderTabContent(p) {
  const body = document.getElementById("pBody");
  body.scrollTop = 0;

  if (currentTab === "overview") {
    let previewClass = "planet-preview" + (p.hasRing ? " has-ring" : "");
    body.innerHTML = `
      <div class="${previewClass}" style="background:radial-gradient(circle at 35% 30%, ${lightenColor(p.color, 60)}, ${p.color}, ${darkenColor(p.color, 60)})"></div>
      <h3 class="sec-title">KEY DATA</h3>
      <div class="info-cards">
        ${p.stats.map(s => `
          <div class="info-card">
            <div class="label">${s.label}</div>
            <div class="value">${s.value}<span class="unit">${s.unit}</span></div>
          </div>
        `).join("")}
      </div>
      <h3 class="sec-title">DESCRIPTION</h3>
      <p style="font-size:14px;color:#C3D3E4;line-height:1.7">${p.lead}</p>
    `;
  } else if (currentTab === "facts") {
    body.innerHTML = `
      <h3 class="sec-title">FUN FACTS ABOUT ${p.en}</h3>
      <ul class="facts-list">
        ${p.facts.map(f => `<li>${f}</li>`).join("")}
      </ul>
    `;
  } else if (currentTab === "composition") {
    body.innerHTML = `
      <h3 class="sec-title">${p.id === "sun" ? "SOLAR" : "ATMOSPHERIC"} COMPOSITION</h3>
      <div class="comp-bar">
        ${p.composition.map(c => `<div class="comp-segment" style="width:${c.pct}%;background:${c.color}"></div>`).join("")}
      </div>
      <div class="comp-legend">
        ${p.composition.map(c => `<span><i style="background:${c.color}"></i>${c.name} (${c.pct}%)</span>`).join("")}
      </div>
      <h3 class="sec-title">SIZE COMPARISON</h3>
      ${buildComparisonBars(p)}
    `;
  } else if (currentTab === "quiz") {
    body.innerHTML = `
      <h3 class="sec-title">TEST YOUR KNOWLEDGE</h3>
      <p style="font-size:15px;margin-bottom:16px">${p.quiz.q}</p>
      <div class="quiz-options">
        ${p.quiz.opts.map((o, i) => `<button class="quiz-option" data-idx="${i}">${o}</button>`).join("")}
      </div>
      <div id="quizResult"></div>
    `;
    body.querySelectorAll(".quiz-option").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.dataset.idx);
        const correct = idx === p.quiz.a;
        body.querySelectorAll(".quiz-option").forEach((b, j) => {
          b.disabled = true;
          if (j === p.quiz.a) b.classList.add("correct");
          else if (j === idx && !correct) b.classList.add("wrong");
        });
        const result = document.getElementById("quizResult");
        result.innerHTML = `<div class="quiz-result ${correct ? "correct" : "wrong"}">
          ${correct ? "✓ Correct!" : "✗ Not quite."} ${p.quiz.why}
        </div>`;
      });
    });
  }
}

function buildComparisonBars(p) {
  const comparisons = [
    { label: "Size vs Earth", value: p.sizeRatio, max: 11, unit: "× Earth diameter" },
    { label: "Distance from Sun", value: p.distAU, max: 31, unit: " AU" },
  ];
  return comparisons.map(c => `
    <div class="compare-bar">
      <div class="bar-label">
        <span>${c.label}</span>
        <span>${c.value}${c.unit}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(c.value / c.max) * 100}%"></div>
      </div>
    </div>
  `).join("");
}

/* ========== EVENT HANDLERS ========== */
document.getElementById("pClose").addEventListener("click", closeDetail);

document.querySelectorAll("#pTabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentTab = btn.dataset.tab;
    updateTabs();
    if (selectedPlanet >= 0) renderTabContent(PLANETS[selectedPlanet]);
  });
});

document.getElementById("pPrev").addEventListener("click", () => {
  if (selectedPlanet > 0) openDetail(selectedPlanet - 1);
});
document.getElementById("pNext").addEventListener("click", () => {
  if (selectedPlanet < PLANETS.length - 1) openDetail(selectedPlanet + 1);
});

// Speed slider
const speedSlider = document.getElementById("speedSlider");
const speedVal = document.getElementById("speedVal");
speedSlider.addEventListener("input", () => {
  simSpeed = speedSlider.value / 50;
  speedVal.textContent = simSpeed.toFixed(1) + "×";
});

// Toggle buttons
document.getElementById("toggleOrbits").addEventListener("click", function() {
  showOrbits = !showOrbits;
  this.textContent = showOrbits ? "SHOW ORBITS" : "HIDE ORBITS";
});

document.getElementById("toggleLabels").addEventListener("click", function() {
  showLabels = !showLabels;
  this.textContent = showLabels ? "LABELS ON" : "LABELS OFF";
});

// Planet dots
const dotsContainer = document.getElementById("planetDots");
PLANETS.forEach((p, i) => {
  const dot = document.createElement("button");
  dot.className = "planet-dot";
  dot.style.background = p.color;
  dot.style.color = p.color;
  dot.innerHTML = `<span class="tooltip">${p.en}</span>`;
  dot.addEventListener("click", () => openDetail(i));
  dotsContainer.appendChild(dot);
});

// View switching
document.querySelectorAll(".nav-pills button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav-pills button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const view = btn.dataset.view;
    document.getElementById("orbitView").style.display = view === "orbit" ? "flex" : "none";
    document.getElementById("sizeView").style.display = view === "size" ? "flex" : "none";
    document.getElementById("distView").style.display = view === "distance" ? "flex" : "none";
    document.getElementById("labelOverlay").style.display = view === "orbit" ? "" : "none";
    if (view === "size") {
      resizeSizeCanvas();
    }
    if (view === "distance") {
      buildDistanceView();
    }
  });
});

/* ========== INTRO ========== */
const intro = document.getElementById("intro");
document.getElementById("enterBtn").addEventListener("click", () => {
  intro.classList.add("hide");
  setTimeout(() => { intro.style.display = "none"; }, 1500);
});

/* ========== ANIMATION LOOP ========== */
let lastTime = 0;
function animate(ts) {
  const dt = lastTime ? (ts - lastTime) / 16.67 : 1;
  lastTime = ts;
  animTime = ts;

  drawStars(ts);

  const orbitView = document.getElementById("orbitView");
  if (orbitView.style.display !== "none") {
    drawOrbitView(dt);
  }

  const sizeView = document.getElementById("sizeView");
  if (sizeView.style.display === "flex") {
    drawSizeView(ts);
  }

  requestAnimationFrame(animate);
}

/* ========== INIT ========== */
resizeOrbitCanvas();
resizeSizeCanvas();
createLabels();
requestAnimationFrame(animate);
</script>
</body>
</html>
